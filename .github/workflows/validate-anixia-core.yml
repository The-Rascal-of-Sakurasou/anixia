name: Validate ANIXIA core
on:
  pull_request:
    paths:
      - "anixia-client.js"
      - "anixia-admin.js"
      - "anixia-auth-pages.js"
      - "anixia-genres.js"
      - "genres.html"
      - "supabase/functions/**"
      - "data-sources.html"
      - ".github/workflows/validate-anixia-core.yml"
  push:
    branches: [main]
    paths:
      - "anixia-client.js"
      - "anixia-admin.js"
      - "anixia-auth-pages.js"
      - "supabase/functions/**"
      - "data-sources.html"
      - ".github/workflows/validate-anixia-core.yml"

jobs:
  javascript-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check browser JavaScript syntax
        run: |
          node --check anixia-client.js
          node --check anixia-admin.js
          node --check anixia-auth-pages.js
          node --check anixia-genres.js

  edge-function-types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check Annict sync Edge Function
        run: deno check --no-lock supabase/functions/sync-annict-catalog/index.ts
      - name: Check AniList poster sync Edge Function
        run: deno check --no-lock supabase/functions/sync-anilist-posters/index.ts
      - name: Check AniList catalog policy guard
        run: deno check --no-lock supabase/functions/sync-anilist-catalog/index.ts
      - name: Check Wikidata catalog sync Edge Function
        run: deno check --no-lock supabase/functions/sync-wikidata-catalog/index.ts
      - name: Check Syoboi title sync Edge Function
        run: deno check --no-lock supabase/functions/sync-syoboi-titles/index.ts
      - name: Enforce AniList image-only source policy
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const poster = readFileSync("supabase/functions/sync-anilist-posters/index.ts", "utf8");
          const catalog = readFileSync("supabase/functions/sync-anilist-catalog/index.ts", "utf8");
          const wikidataCatalog = readFileSync("supabase/functions/sync-wikidata-catalog/index.ts", "utf8");
          const transparency = readFileSync("data-sources.html", "utf8");
          const forbidden = /episode_count|titleJaUpdated|episodeCountUpdated|metadataPatch|media\.episodes|media\.status/;
          if (forbidden.test(poster)) throw new Error("AniList poster sync must not read or write catalog metadata.");
          if (!catalog.includes("SOURCE_POLICY_DISABLED") || !catalog.includes("410")) {
            throw new Error("AniList catalog ingestion must remain disabled.");
          }
          if (wikidataCatalog.includes("fetchAniListNativeTitles") ||
              wikidataCatalog.includes("titleRepairsFromAniList") ||
              wikidataCatalog.includes("graphql.anilist.co")) {
            throw new Error("Wikidata catalog sync must not fetch AniList metadata.");
          }
          const reviewStart = wikidataCatalog.indexOf("async function autoReviewWikidata");
          const reviewEnd = wikidataCatalog.indexOf("Deno.serve", reviewStart);
          const review = wikidataCatalog.slice(reviewStart, reviewEnd);
          if (reviewStart < 0 || !review.includes('.eq("source","wikidata").eq("is_published",false)') ||
              !review.includes('reviewedSources:["wikidata"]')) {
            throw new Error("Automatic catalog review must process Wikidata records only.");
          }
          if (!transparency.includes("AniList（作品画像の照合のみ）")) {
            throw new Error("Public source policy must disclose AniList image-only use.");
          }
          console.log("AniList image-only and Wikidata-only review policy checks passed.");
          NODE
