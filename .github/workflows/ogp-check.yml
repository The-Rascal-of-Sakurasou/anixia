name: OGP metadata and image validation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "*.html"
      - "assets/anixia-og.png"
      - ".github/workflows/ogp-check.yml"

permissions:
  contents: read

jobs:
  ogp:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate public page OGP and deployed image
        env:
          BASE_URL: https://the-rascal-of-sakurasou.github.io/anixia/
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';

          const pages = [
            'index.html', 'anime.html', 'season.html', 'ranking.html',
            'recommendations.html', 'quiz.html', 'mypage.html',
            'community.html', 'discover.html', 'entities.html',
            'data-sources.html', 'terms.html', 'privacy.html',
            'operator.html', 'quiz-play.html', 'anime-detail.html',
            'entity-detail.html'
          ];
          const base = process.env.BASE_URL;
          const imageUrl = new URL('assets/anixia-og.png', base).href;
          const failures = [];
          const getMeta = (html, key, attr = 'property') => {
            for (const tag of html.match(/<meta\\b[^>]*>/gi) || []) {
              const attrValue = tag.match(new RegExp('\\\\b' + attr + '="([^"]*)"', 'i'))?.[1];
              const contentValue = tag.match(/\\bcontent="([^"]*)"/i)?.[1];
              if (attrValue === key) return contentValue ?? null;
            }
            return null;
          };

          for (const file of pages) {
            const html = readFileSync(file, 'utf8');
            const required = [
              ['og:title', 'property'],
              ['og:description', 'property'],
              ['og:url', 'property'],
              ['og:type', 'property'],
              ['og:image', 'property'],
              ['og:image:width', 'property'],
              ['og:image:height', 'property'],
              ['twitter:card', 'name'],
              ['twitter:image', 'name']
            ];
            for (const [key, attr] of required) {
              if (!getMeta(html, key, attr)) failures.push(file + ': missing ' + key);
            }
            if (getMeta(html, 'og:image', 'property') !== imageUrl) failures.push(file + ': og:image URL mismatch');
            if (getMeta(html, 'twitter:image', 'name') !== imageUrl) failures.push(file + ': twitter:image URL mismatch');
            if (getMeta(html, 'og:image:width', 'property') !== '1200') failures.push(file + ': og:image width is not 1200');
            if (getMeta(html, 'og:image:height', 'property') !== '630') failures.push(file + ': og:image height is not 630');
            if (getMeta(html, 'twitter:card', 'name') !== 'summary_large_image') failures.push(file + ': twitter card is not summary_large_image');
          }

          const response = await fetch(imageUrl, { redirect: 'follow' });
          if (!response.ok) failures.push('OGP image HTTP status: ' + response.status);
          const contentType = response.headers.get('content-type') || '';
          if (!contentType.toLowerCase().includes('image/png')) failures.push('OGP image content-type is not image/png: ' + contentType);
          const bytes = new Uint8Array(await response.arrayBuffer());
          const signature = [137,80,78,71,13,10,26,10];
          if (signature.some((v, i) => bytes[i] !== v)) {
            failures.push('OGP image does not have a valid PNG signature');
          } else {
            const view = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
            const width = view.getUint32(16);
            const height = view.getUint32(20);
            if (width !== 1200 || height !== 630) failures.push('OGP image dimensions are ' + width + 'x' + height + ', expected 1200x630');
            console.log('OGP image verified: HTTP ' + response.status + ', ' + contentType + ', ' + width + 'x' + height + ', ' + bytes.length + ' bytes');
          }

          if (failures.length) {
            console.error('OGP validation failed:\\n' + failures.join('\\n'));
            process.exit(1);
          }
          console.log('OGP metadata passed for ' + pages.length + ' public pages.');
          NODE
